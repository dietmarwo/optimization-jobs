[package]
name = "optimization-job-api"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Versioned optimization jobs for agents: job envelope, result contract with claims and evidence, checked journals and the worker SDK"
repository = "https://github.com/dietmarwo/optimization-jobs"
homepage = "https://dietmarwo.github.io/optimization-jobs/"
documentation = "https://docs.rs/optimization-job-api"
readme = "README.md"
keywords = ["optimization", "jobs", "agents", "solver", "mcp"]
categories = ["science", "mathematics"]
publish = ["crates-io"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
libc = "0.2"
fs2 = "0.4"
[dev-dependencies]
tempfile = "3"
