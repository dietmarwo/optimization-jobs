# Release workflow for crates.io, modeled on fcmaes-rust's publish-crates.yml.
# A tag vX.Y.Z must equal the version of both crates. Without the repository
# variable CRATES_IO_TRUSTED_PUBLISHING=true, the workflow validates and skips
# the upload (see RELEASING.md for the one-time registry setup).
name: Publish crates to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Require the tag to match the crate versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          for crate in optimization-job-api optimization-runner; do
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')"
            test "$GITHUB_REF_NAME" = "v$version" || { echo "$crate is $version"; exit 1; }
          done
      - name: Validate formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Verify both packages
        run: cargo publish --workspace --dry-run --locked
      - name: Explain first-release bootstrap
        if: vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        run: |
          echo "Validation passed. Upload skipped until the crates exist,"
          echo "their Trusted Publishers are configured, and the repository"
          echo "variable CRATES_IO_TRUSTED_PUBLISHING is set to true."
      - name: Obtain a short-lived crates.io token
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish optimization-job-api, then optimization-runner
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && startsWith(github.ref, 'refs/tags/')
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
