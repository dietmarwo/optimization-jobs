name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The mixed node clones the workers at their main: a weekly run notices a
  # worker change that breaks this runner even when nothing changed here.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The review tests validate against the JSON Schemas; they must not skip.
  JOB_API_REQUIRE_SCHEMA: "1"

jobs:
  rust:
    name: Format, lint, tests, docs and runner regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install "jsonschema>=4.18,<5"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - name: Runner regressions and the MCP server with the protocol fixture worker
        run: |
          cargo build --release --locked -p optimization-runner
          python3 scripts/job-api/test_review.py
          python3 scripts/job-api/test_mcp.py
      # In a container whose /proc belongs to an enclosing PID namespace,
      # /proc directory names are not the PIDs this namespace uses; the tests
      # that inspect processes map them (review OJ-05).
      - name: The same tests in a nested PID namespace with the outer /proc
        run: |
          for suite in test_review.py test_mcp.py; do
            sudo -E unshare --pid --fork --kill-child --setuid "$(id -u)" --setgid "$(id -g)" \
              "$(command -v python3)" "scripts/job-api/$suite"
          done

  msrv:
    name: Rust 1.88 (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  mixed-node:
    # pinned: each worker built with the optimization-jobs revision it pins,
    # against this runner (new runner, released workers). checkout: the
    # workers' shared dependencies replaced by this checkout, so a change of
    # the worker SDK is built and run inside the real workers before they
    # are repinned to it.
    name: Mixed node with the fcmaes, LP-IP and SQP workers (${{ matrix.sdk }} SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, checkout]
    steps:
      - uses: actions/checkout@v4
      - name: Worker repositories at main
        run: |
          for repo in fcmaes-rust LP-IP-craft SQP-craft; do
            git clone --depth 1 "https://github.com/dietmarwo/$repo" "$RUNNER_TEMP/$repo"
            echo "$repo $(git -C "$RUNNER_TEMP/$repo" rev-parse HEAD)"
          done
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ${{ runner.temp }}/fcmaes-rust
            ${{ runner.temp }}/LP-IP-craft
            ${{ runner.temp }}/SQP-craft
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install "jsonschema>=4.18,<5"
      - name: Build this runner and the three workers
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          cargo build --release --locked -p optimization-runner
          url=https://github.com/dietmarwo/optimization-jobs
          if [ "$SDK" = checkout ]; then
            # The lockfiles name the pinned revision, so --locked cannot hold.
            flags=(--config "patch.\"$url\".optimization-job-api.path=\"$PWD/crates/optimization-job-api\""
                   --config "patch.\"$url\".optimization-runner.path=\"$PWD/crates/optimization-runner\"")
          else
            flags=(--locked)
          fi
          for build in fcmaes-rust:fcmaes-job-worker LP-IP-craft:lp-ip-job-worker SQP-craft:sqp-job-worker; do
            repo=${build%%:*} package=${build#*:}
            (cd "$RUNNER_TEMP/$repo" && cargo build --release "${flags[@]}" -p "$package")
            # Which optimization-job-api the worker was built with.
            (cd "$RUNNER_TEMP/$repo" && cargo metadata --format-version 1 "${flags[@]}") |
              python3 scripts/job-api/sdk_source.py "$SDK" "$PWD" "$repo"
          done
      - name: Harness on one node with all three workers
        run: >-
          python3 scripts/job-api/test_integration.py
          --fcmaes "$RUNNER_TEMP/fcmaes-rust/target/release/fcmaes-job-worker"
          --lp-ip "$RUNNER_TEMP/LP-IP-craft/target/release/lp-ip-job-worker"
          --sqp "$RUNNER_TEMP/SQP-craft/target/release/sqp-job-worker"
      - name: MCP server with each worker
        env:
          JOB_API_REQUIRE_WORKER: "1"
        run: |
          for worker in fcmaes-rust/target/release/fcmaes-job-worker \
              LP-IP-craft/target/release/lp-ip-job-worker SQP-craft/target/release/sqp-job-worker; do
            target="$RUNNER_TEMP/mcp-$(basename "$worker")"
            mkdir -p "$target"
            ln -sf "$PWD/target/release/optimization-run" "$PWD/target/release/optimization-mcp" \
              "$RUNNER_TEMP/$worker" "$target/"
            JOB_API_TARGET="$target" python3 scripts/job-api/test_mcp.py \
              Jobs.test_a_real_worker_reports_claims_and_evidence \
              Jobs.test_a_real_worker_runs_its_examples_over_mcp_only
          done
